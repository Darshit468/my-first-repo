name: Weekly log reminder

# Runs every Saturday at 12:30 UTC, which is 18:00 India time.
on:
  schedule:
    - cron: "30 12 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Count commits from the last seven days
        id: activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/commits?since=$SINCE&per_page=100" --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Open this week's log issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ steps.activity.outputs.count }}
        run: |
          TITLE="Week log - $(date -u +%Y-%m-%d)"
          {
            echo "Commits in this repo over the last 7 days: **$COMMITS**"
            echo ""
            echo "## What I built"
            echo "- "
            echo ""
            echo "## What I learned"
            echo "- "
            echo ""
            echo "## Next week"
            echo "- "
            echo ""
            echo "---"
            echo "Three lines is enough. Close the issue when it's written."
          } > body.md
          URL=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Push the reminder to the phone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COMMITS: ${{ steps.activity.outputs.count }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret is not set, so there is no phone to notify."
            echo "Add the secret in Settings, then run this workflow again."
            exit 0
          fi
          curl -fsS \
            -H "Title: Weekly GitHub log" \
            -H "Tags: memo" \
            -H "Click: $ISSUE_URL" \
            --data "This week: $COMMITS commit(s). Fill in your log: $ISSUE_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"
